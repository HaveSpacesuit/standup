:root {
  --stratakit-font-family-sans: "InterVariable", "Noto Sans", "Open Sans", sans-serif;
  --c-Blocked: var(--stratakit-color-bg-critical-base);
  --c-New: var(--stratakit-color-bg-info-base);
  --c-Active: var(--stratakit-color-bg-accent-base);
  --c-Review: var(--stratakit-color-bg-attention-base);
  --c-Done: var(--stratakit-color-bg-positive-base);
  --t-1: var(--stratakit-color-text-neutral-primary);
  --t-2: var(--stratakit-color-text-neutral-secondary);
  --t-3: var(--stratakit-color-text-neutral-tertiary);
  --t-critical: var(--stratakit-color-text-critical-base);
  --t-attention: var(--stratakit-color-text-attention-base);
  --t-positive: var(--stratakit-color-text-positive-base);
  --t-info: var(--stratakit-color-text-info-base);
  --surface: var(--stratakit-color-bg-elevation-level-1);
  --divider: var(--stratakit-color-border-glow-strong-default);
  --track: var(--stratakit-color-bg-glow-on-surface-neutral-pressed);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--stratakit-font-family-sans); font-size: 14px; color: var(--t-1); background: var(--stratakit-color-bg-page-base); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.sk-icon { width: 16px; height: 16px; flex: 0 0 auto; display: inline-block; vertical-align: text-bottom; }
.spacer { flex: 1 1 auto; }
[hidden] { display: none !important; }

/* ---------- Page chrome ---------- */
.page-head { padding: 16px 20px 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: var(--stratakit-font-size-headline-md); margin: 0; font-weight: 600; }
.page-head p { margin: 0; color: var(--t-2); font-size: 13px; }
.controls { padding: 4px 20px 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--divider); }
.tabs { display: inline-flex; gap: 2px; border-bottom: 1px solid var(--divider); }
.tab { appearance: none; border: 0; background: none; font: inherit; font-size: 13px; padding: 6px 10px; color: var(--t-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--t-1); font-weight: 600; border-bottom-color: var(--stratakit-color-border-accent-strong); }
.group-label { font-size: 11px; color: var(--t-3); text-transform: uppercase; letter-spacing: .04em; }
.toggles { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tbtn { appearance: none; font: inherit; font-size: 12px; height: 28px; padding: 0 10px; border-radius: var(--stratakit-radius-sm); border: 1px solid var(--stratakit-color-border-neutral-muted); background: var(--surface); color: var(--t-1); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:hover { background: color-mix(in srgb, var(--surface), black 4%); }
.tbtn[aria-pressed="true"] { background: var(--stratakit-color-bg-accent-muted); border-color: var(--stratakit-color-border-accent-strong); color: var(--stratakit-color-text-accent-strong); font-weight: 600; }
.tbtn .num { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-weight: 700; background: var(--track); }
.tbtn[aria-pressed="true"] .num { background: var(--stratakit-color-bg-accent-base); color: white; }
.tbtn.preset { border-style: dashed; }

.rationale { padding: 10px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; border-bottom: 1px solid var(--divider); background: var(--stratakit-color-bg-page-depth); }
.rcard { background: var(--surface); border: 1px solid var(--divider); border-radius: var(--stratakit-radius-md); padding: 10px 12px; font-size: 12px; line-height: 1.45; color: var(--t-2); }
.rcard h3 { margin: 0 0 4px; font-size: 13px; color: var(--t-1); display: flex; gap: 6px; align-items: center; }
.rcard h3 .num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; background: var(--stratakit-color-bg-accent-base); color: white; }
.rcard .tag { font-weight: 600; color: var(--t-1); }
.rcard ul { margin: 2px 0 4px; padding-left: 16px; }
.rcard li { margin: 1px 0; }
.rcard .facts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11px; }
.rcard .facts span b { color: var(--t-1); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 11px; color: var(--t-2); margin-top: 6px; }
.legend > span { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Board ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; font-size: 13px; }
.toolbar .title { font-weight: 700; font-size: 16px; display: inline-flex; gap: 6px; align-items: center; }
.toolbar .sprint-chip { font-size: 12px; color: var(--t-2); border: 1px solid var(--stratakit-color-border-neutral-muted); border-radius: 999px; padding: 1px 8px; }
.toolbar .note { color: var(--t-3); font-size: 12px; }
.board-scroll { overflow: visible; border-top: 1px solid var(--divider); }
.board { display: grid; grid-template-columns: 168px repeat(5, minmax(250px, 1fr)); min-width: 1460px; }
.hcell { position: sticky; top: 0; z-index: 20; padding: 10px 12px; border-bottom: 1px solid var(--divider); display: flex; gap: 8px; align-items: stretch; }
.hcell.member { left: 0; z-index: 21; background: var(--surface); border-right: 1px solid var(--divider); font-weight: 700; font-size: 12px; align-items: flex-start; }
.hcell .bar { width: 4px; border-radius: 999px; min-height: 32px; }
.hcell .h-name { font-weight: 700; font-size: 12px; }
.hcell .h-sub { font-size: 11px; color: var(--t-2); }
.hcell .h-count { margin-left: auto; font-weight: 700; font-size: 14px; }
.rowhead { position: sticky; left: 0; z-index: 15; background: var(--surface); padding: 10px 12px; border-right: 1px solid var(--divider); border-bottom: 1px solid var(--divider); display: flex; gap: 8px; align-items: flex-start; font-size: 12px; }
.rowhead .note { display: block; font-size: 10px; color: var(--t-3); margin-top: 2px; }
.cell { padding: 6px; border-bottom: 1px solid var(--divider); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tint-Blocked { background: color-mix(in srgb, var(--c-Blocked) 14%, var(--surface)); }
.tint-New { background: color-mix(in srgb, var(--c-New) 14%, var(--surface)); }
.tint-Active { background: color-mix(in srgb, var(--c-Active) 14%, var(--surface)); }
.tint-Review { background: color-mix(in srgb, var(--c-Review) 14%, var(--surface)); }
.tint-Done { background: color-mix(in srgb, var(--c-Done) 14%, var(--surface)); }

/* ---------- Avatars ---------- */
.avatar { display: inline-grid; place-items: center; border-radius: 50%; width: 16px; height: 16px; font-size: 7px; font-weight: 700; color: oklch(32% .06 var(--h)); background: oklch(88% .07 var(--h)); flex: 0 0 auto; letter-spacing: 0; }
.avatar.lg { width: 26px; height: 26px; font-size: 10px; }

/* ---------- Card: shared ---------- */
.card { position: relative; container-type: inline-size; border-radius: var(--stratakit-radius-sm); background: var(--surface); padding: 4px 6px; font-size: 12px; line-height: 1.25; transition: transform 160ms ease, box-shadow 160ms ease, opacity 120ms ease, filter 120ms ease; outline: none; }
.card:focus-visible { outline: 2px solid var(--stratakit-color-border-accent-strong); outline-offset: 2px; }
.col-Blocked { --accent: var(--c-Blocked); }
.col-New { --accent: var(--c-New); }
.col-Active { --accent: var(--c-Active); }
.col-Review { --accent: var(--c-Review); }
.col-Done { --accent: var(--c-Done); }
.title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; word-break: break-word; color: var(--t-1); }
.type-ic { width: 14px; height: 14px; display: inline-block; vertical-align: text-bottom; margin-right: 4px; }
.type-ic.bug { color: var(--c-Blocked); }
.type-ic.pbi { color: var(--c-New); }
.wi-id { font-weight: 700; color: var(--accent); margin-right: 4px; }
.sec { clear: both; margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--divider); display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }

/* ---------- Card: current replica ---------- */
.card.classic { border: 1px solid var(--accent); box-shadow: 0 2px 1px -1px rgb(0 0 0 / .2), 0 1px 1px 0 rgb(0 0 0 / .14), 0 1px 3px 0 rgb(0 0 0 / .12); }
.card.classic:not(.expanded):hover, .card.classic:not(.expanded):focus-within { z-index: 30; transform: translateY(-2px) scale(1.05); box-shadow: 0 7px 8px -4px rgb(0 0 0 / .2), 0 12px 17px 2px rgb(0 0 0 / .14), 0 5px 22px 4px rgb(0 0 0 / .12); opacity: 1; filter: none; }
.card.glow { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 72%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 42%, transparent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.card.stale { opacity: .68; filter: saturate(.78); }
.state-chip { float: right; margin: 0 0 1px 6px; padding: 0 6px; max-width: 130px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 10px; line-height: 1.5; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-word; color: var(--t-2); }
.pr-only .pr-line { -webkit-line-clamp: 3; color: var(--t-1); }
.pr-ic { width: 14px; height: 14px; display: inline-block; vertical-align: text-bottom; margin-right: 4px; color: var(--accent); }
.pr-id { color: var(--accent); margin-right: 4px; }
.appr-icons { float: right; display: inline-flex; gap: 1px; margin: 1px 0 0 4px; }
.appr-icons.positive { color: var(--c-Done); }
.appr-icons.attention { color: var(--c-Review); }
.appr-icons.critical { color: var(--c-Blocked); }
.checks-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; margin-top: 3px; }
.checks-l { display: grid; gap: 1px; min-width: 0; }
.ck { display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1.2; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ck.opt { padding-left: 20px; color: var(--t-1); }
.critical-t { color: var(--t-critical); } .attention-t { color: var(--t-attention); } .positive-t { color: var(--t-positive); } .neutral-t { color: var(--t-3); }
.age { font-size: 10px; color: var(--t-2); opacity: .85; white-space: nowrap; align-self: center; }
.footer { clear: both; margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--divider); display: flex; align-items: center; gap: 4px; min-width: 0; }
.footer .ef-l { font-size: 10px; color: var(--t-2); }
.footer .ef-v { font-size: 11px; font-weight: 500; color: var(--accent); }
.sprint { display: inline-flex; align-items: center; gap: 2px; font-size: 10px; color: var(--t-2); opacity: .85; white-space: nowrap; }
.sprint .sk-icon { width: 13px; height: 13px; color: var(--accent); }
.tags { clear: both; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.tagpill { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--divider); font-size: 9px; font-weight: 500; color: var(--t-2); background: var(--surface); white-space: nowrap; }

/* ---------- Proposal 1: Quiet card ---------- */
.card.quiet { border: 1px solid var(--divider); box-shadow: inset 3px 0 0 var(--accent), 0 1px 2px rgb(0 0 0 / .06); padding: 5px 7px 5px 10px; }
.card.quiet:not(.expanded):hover, .card.quiet:not(.expanded):focus-within { z-index: 30; transform: translateY(-1px); box-shadow: inset 3px 0 0 var(--accent), 0 6px 16px rgb(0 0 0 / .14); opacity: 1; filter: none; }
.card.quiet .title { -webkit-line-clamp: 2; }
.card.quiet.expanded .title { -webkit-line-clamp: unset; }
.card.expanded .title, .card.expanded .pr-line { display: block; }
.card.quiet .wi-id { color: var(--t-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.card.quiet .type-ic { color: var(--stratakit-color-icon-neutral-secondary); }
.card.quiet .pr-ic, .card.quiet .pr-id { color: var(--t-3); }
.card.quiet .sec { border-top-color: var(--stratakit-color-border-glow-base-default); margin-top: 4px; padding-top: 4px; }
.effort-bubble { float: right; margin: 0 0 1px 6px; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--stratakit-color-border-neutral-muted); color: var(--t-2); font-size: 11px; font-weight: 600; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
.qpr { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 11px; color: var(--t-2); }
.qpr .qpr-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qpr .sk-icon { width: 14px; height: 14px; }
.appr-txt { font-size: 11px; color: var(--t-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.appr-txt.positive { color: var(--t-positive); font-weight: 600; }
.appr-txt.critical { color: var(--t-critical); font-weight: 600; }
.appr-txt.attention { color: var(--t-attention); font-weight: 600; }
.detail { font-size: 11px; line-height: 1.25; display: flex; align-items: center; gap: 4px; min-width: 0; }
.detail .sk-icon { width: 14px; height: 14px; }
.detail span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { clear: both; display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--t-3); min-width: 0; min-height: 16px; }
.meta .sprint { font-size: 10px; }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 16px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--stratakit-color-border-neutral-muted); color: var(--t-2); font-size: 10px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; min-width: 0; flex: 0 1 auto; }
.badge .sk-icon { width: 12px; height: 12px; }
.badge.critical { border-color: var(--stratakit-color-border-critical-muted); color: var(--t-critical); background: var(--stratakit-color-bg-critical-transparent); }
.badge.attention { border-color: var(--stratakit-color-border-attention-muted); color: var(--t-attention); background: var(--stratakit-color-bg-attention-transparent); }
.badge.positive { border-color: var(--stratakit-color-border-positive-muted); color: var(--t-positive); background: var(--stratakit-color-bg-positive-transparent); }
.badge.info { border-color: var(--stratakit-color-border-info-muted); color: var(--t-info); background: var(--stratakit-color-bg-info-transparent); }

/* ---------- Proposal 2: Next step & owner ---------- */
.step { display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1.3; color: var(--t-2); min-width: 0; min-height: 18px; }
.step .sk-icon { width: 14px; height: 14px; }
.step .txt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step.critical { color: var(--t-critical); font-weight: 500; }
.step.attention { color: var(--t-attention); font-weight: 500; }
.step.positive { color: var(--t-positive); font-weight: 500; }
.step.neutral { color: var(--t-2); }
.card > .step { margin-top: 4px; clear: both; }
.owner { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; border-radius: 999px; background: var(--stratakit-color-bg-glow-on-surface-neutral-pressed); color: var(--t-2); font-size: 10px; font-weight: 500; white-space: nowrap; }
.owner.person { padding-left: 2px; background: var(--stratakit-color-bg-info-transparent); color: var(--t-info); }
.owner.person .avatar { width: 14px; height: 14px; font-size: 6px; }

/* ---------- Proposal 3: PR progress strip ---------- */
.pr-row { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; color: var(--t-2); }
.pr-row .pr-ic { margin-right: 0; }
.pr-row .pr-id { margin-right: 0; }
.repo { font-size: 10px; color: var(--t-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.strip { display: inline-flex; gap: 2px; flex: 0 0 auto; align-items: center; }
.seg { position: relative; width: 26px; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.seg > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; }
.seg.critical > i { background: var(--stratakit-color-bg-critical-base); }
.seg.attention > i { background: var(--stratakit-color-bg-attention-base); }
.seg.positive > i { background: var(--stratakit-color-bg-positive-base); }
.seg.pending > i { background: repeating-linear-gradient(-45deg, var(--stratakit-color-bg-attention-base) 0 3px, color-mix(in srgb, var(--stratakit-color-bg-attention-base) 35%, transparent) 3px 6px); }
.seg.ready { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stratakit-color-bg-positive-base); }
.compact .seg { width: 14px; height: 5px; }

/* ---------- Proposal 4: Meaningful aging ---------- */
.card.changed::before { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--stratakit-color-bg-info-base); box-shadow: 0 0 0 2px var(--surface); z-index: 2; }
.aging { display: inline-flex; gap: 2px; align-items: center; flex: 0 0 auto; }
.aging i { width: 5px; height: 5px; border-radius: 50%; background: var(--track); }
.aging i.on { background: var(--t-3); }
.aging.attention i.on { background: var(--stratakit-color-bg-attention-base); }
.aging.critical i.on { background: var(--stratakit-color-bg-critical-base); }

/* ---------- Proposal 5: Compact + hover details ---------- */
.card.compact .title { -webkit-line-clamp: 1; }
.card.compact:not(.expanded):hover, .card.compact:not(.expanded):focus-within { transform: none; }
.glyphs { clear: both; display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 10px; color: var(--t-3); min-height: 16px; min-width: 0; }
.glyph { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.glyph .sk-icon { width: 13px; height: 13px; }
.glyph.critical { color: var(--t-critical); } .glyph.attention { color: var(--t-attention); } .glyph.positive { color: var(--t-positive); } .glyph.neutral { color: var(--t-3); }
.hovercard { display: none; position: absolute; top: -6px; left: calc(100% + 8px); width: 320px; z-index: 60; background: var(--surface); border-radius: var(--stratakit-radius-md); box-shadow: 0 10px 28px rgb(0 0 0 / .22), 0 0 0 1px var(--divider); padding: 8px; cursor: default; }
.flip .hovercard { left: auto; right: calc(100% + 8px); }
.card.compact:hover > .hovercard, .card.compact:focus-within > .hovercard { display: block; }
.hovercard .card { box-shadow: none !important; border: 0 !important; padding: 0 !important; transform: none !important; }
.hovercard .card.quiet { padding-left: 8px !important; box-shadow: inset 3px 0 0 var(--accent) !important; }
.hc-extra { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--divider); display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11px; color: var(--t-2); }
.hc-extra dt { color: var(--t-3); }
.hc-extra dd { margin: 0; display: flex; align-items: center; gap: 4px; min-width: 0; }

/* ---------- Gallery ---------- */
.gallery-scroll { overflow: visible; }
.gallery { display: grid; grid-template-columns: 190px repeat(var(--cols), 294px); gap: 10px 12px; padding: 14px 20px 40px; align-items: start; }
.g-colhead { position: sticky; top: 0; z-index: 25; background: var(--stratakit-color-bg-page-base); padding: 6px 0; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--divider); }
.g-colhead small { display: block; font-weight: 400; color: var(--t-3); font-size: 11px; }
.g-rowhead { font-size: 12px; color: var(--t-1); font-weight: 600; padding-top: 6px; }
.g-rowhead small { display: block; font-weight: 400; color: var(--t-2); font-size: 11px; margin-top: 2px; line-height: 1.35; }
.g-cell { padding: 6px; border-radius: var(--stratakit-radius-md); }
.g-cell .colname { font-size: 10px; color: var(--t-3); margin: 0 0 4px 2px; }
</style>
</head>

// ---------- helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (name, cls = '') => `<svg class="sk-icon ${cls}" aria-hidden="true"><use href="#sk-${name}"/></svg>`;
const typeIcon = (t) => `<svg class="type-ic ${t}" role="img" aria-label="${t === 'bug' ? 'Bug' : 'Product backlog item'}"><use href="#wit-${t}"/></svg>`;
const prIcon = () => `<svg class="pr-ic" aria-hidden="true"><use href="#sk-git-branch"/></svg>`;
const initials = (name) => name.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const shortName = (name) => { const [a, b] = name.split(' '); return b ? `${a} ${b[0]}.` : a; };
const avatar = (pid, cls = '') => { const p = PEOPLE[pid]; return `<span class="avatar ${cls}" style="--h:${p.h}" title="${esc(p.name)}${p.qa ? ' (QA)' : ''}">${initials(p.name)}</span>`; };
const abbr = (s) => { const w = s.trim().split(/\s+/); return w.length < 3 ? s : w.map((x) => x[0].toUpperCase()).join(''); };
const shortSprint = (s) => s.replace(/\s*\(.*\)$/, '');
const isDefaultState = (item, col) => !item.state || (DEFAULT_STATES[col] || []).includes(item.state);

function prStep(pr) {
  const c = pr.checks;
  if (c.req === 'failing') return { tone: 'critical', icon: 'error', text: `Fix failing check: ${c.names.join(', ')}` };
  if (pr.review === 'rejected') return { tone: 'critical', icon: 'status-rejected', text: 'Rejected — rework needed' };
  if (pr.review === 'waiting-for-author') return { tone: 'attention', icon: 'user-edit', text: 'Respond to review feedback' };
  if (c.req === 'pending') return { tone: 'neutral', icon: 'stopwatch', text: `Waiting on ${c.names.join(', ')}`, owner: { kind: 'pipeline' } };
  const need = Math.max(0, REQUIRED_APPROVALS - pr.approvals);
  if (need > 0) return { tone: 'neutral', icon: 'users', text: need === 1 ? 'Needs 1 more approval' : `Needs ${need} approvals`, owner: { kind: 'reviewers' } };
  return { tone: 'positive', icon: 'git-merge', text: 'Ready to complete' };
}

function cardStep(item) {
  if (item.status === 'Blocked') return { tone: 'critical', icon: 'lock', text: `Blocked · ${item.blockedReason || 'no reason given'}` };
  if (item.state === 'Failed Testing') return { tone: 'critical', icon: 'status-rejected', text: 'Failed testing', coversState: true, owner: item.returnedBy ? { kind: 'from', pid: item.returnedBy } : null };
  if (item.assignedTo && item.assignedTo !== item.dev && item.status === 'Review') return { tone: 'neutral', icon: 'inspection', text: 'In testing', coversState: true, owner: { kind: 'person', pid: item.assignedTo } };
  return null;
}

function ownerChip(owner) {
  if (!owner) return '';
  if (owner.kind === 'reviewers') return `<span class="owner" title="Waiting on reviewers">Reviewers</span>`;
  if (owner.kind === 'pipeline') return `<span class="owner" title="Waiting on the build pipeline">Pipeline</span>`;
  const p = PEOPLE[owner.pid];
  if (owner.kind === 'from') return `<span class="owner" title="Returned by ${esc(p.name)}">${avatar(owner.pid)}from ${esc(shortName(p.name))}</span>`;
  return `<span class="owner person" title="Currently assigned to ${esc(p.name)}${p.qa ? ' (QA)' : ''}">${avatar(owner.pid)}${esc(shortName(p.name))}</span>`;
}

const stepLine = (s) => `<div class="step ${s.tone}">${icon(s.icon)}<span class="txt" title="${esc(s.text)}">${esc(s.text)}</span>${ownerChip(s.owner)}</div>`;

function agingDots(item, col) {
  if (!['Blocked', 'Active', 'Review'].includes(col)) return '';
  const d = item.idle ?? 0;
  const n = d >= 8 ? 4 : d >= 6 ? 3 : d >= 4 ? 2 : d >= 2 ? 1 : 0;
  if (!n) return '';
  const tone = n >= 4 ? 'critical' : n >= 3 ? 'attention' : '';
  return `<span class="aging ${tone}" role="img" aria-label="No activity for ${d} days" title="No activity for ${d} days">${[0, 1, 2, 3].map((i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
}

const changeChip = (item) => item.change ? `<span class="badge ${item.change.kind}" title="Changed since last standup">${esc(item.change.text)} · ${esc(item.change.when)}</span>` : '';

function stateBadge(item, col, f = {}) {
  if (item.kind === 'pr' || isDefaultState(item, col)) return '';
  if (f.n && cardStep(item)?.coversState) return '';
  return `<span class="badge ${STATE_TONE[item.state] || ''}" title="State: ${esc(item.state)}">${esc(item.state)}</span>`;
}

function rolloverIcon(item) {
  return item.rolled ? `<span class="sprint" title="Rolled over from ${esc(item.rolled)}">${icon('reschedule')}</span>` : '';
}

function approvalIcons(pr) {
  if (pr.review === 'rejected') return `<span class="appr-icons critical" title="Rejected">${icon('status-rejected')}</span>`;
  if (pr.review === 'waiting-for-author') return `<span class="appr-icons attention" title="Waiting on author">${icon('status-pending')}</span>`;
  if (pr.approvals >= 2) return `<span class="appr-icons positive" title="2+ approved">${icon('status-success')}${icon('status-success')}</span>`;
  if (pr.approvals === 1) return `<span class="appr-icons positive" title="1 approved">${icon('status-success')}</span>`;
  return '';
}

function approvalText(pr) {
  if (pr.review === 'rejected') return `<span class="appr-txt critical" title="Rejected">Rejected</span>`;
  if (pr.review === 'waiting-for-author') return `<span class="appr-txt attention" title="Reviewer is waiting on the author">Waiting</span>`;
  const done = pr.approvals >= REQUIRED_APPROVALS;
  return `<span class="appr-txt ${done ? 'positive' : ''}" title="${pr.approvals} of ${REQUIRED_APPROVALS} approvals">${icon('users')} ${Math.min(pr.approvals, 9)}/${REQUIRED_APPROVALS}</span>`;
}

function checksTone(pr) {
  const r = pr.checks.req;
  return r === 'failing' ? 'critical' : r === 'pending' ? 'attention' : r === 'passing' ? 'positive' : 'neutral';
}

function checksTip(pr) {
  const c = pr.checks;
  let t = c.req === 'failing' ? `Required checks failing: ${c.names.join(', ')}` : c.req === 'pending' ? `Required checks pending: ${c.names.join(', ')}` : c.req === 'passing' ? 'Required checks passing' : 'No applicable checks';
  if (c.optFail.length) t += ` · Optional checks failing: ${c.optFail.join(', ')}`;
  return t;
}

function seg(tone, fill, tip) { return `<span class="seg ${tone}" title="${esc(tip)}"><i style="width:${fill}%"></i></span>`; }

function strip(pr) {
  const c = pr.checks;
  const cTone = c.req === 'failing' ? 'critical' : c.req === 'pending' ? 'pending' : c.req === 'passing' ? 'positive' : '';
  let rTone = 'positive', rFill = Math.min(pr.approvals, REQUIRED_APPROVALS) / REQUIRED_APPROVALS * 100, rTip = `Review: ${pr.approvals} of ${REQUIRED_APPROVALS} approvals`;
  if (pr.review === 'rejected') { rTone = 'critical'; rFill = 100; rTip = 'Review: rejected'; }
  if (pr.review === 'waiting-for-author') { rTone = 'attention'; rFill = 100; rTip = 'Review: waiting on author'; }
  const ready = c.req === 'passing' && pr.approvals >= REQUIRED_APPROVALS && !['rejected', 'waiting-for-author'].includes(pr.review);
  const label = `PR ${pr.id}. ${checksTip(pr)}. ${rTip}. ${ready ? 'Ready to complete' : 'Not ready to complete'}.`;
  return `<span class="strip" role="img" aria-label="${esc(label)}">${seg(cTone, cTone ? 100 : 0, 'Checks: ' + checksTip(pr))}${seg(rTone, rFill, rTip)}${seg(ready ? 'ready' : '', 0, ready ? 'Complete: ready' : 'Complete: not ready')}</span>`;
}

// ---------- PR blocks ----------
function prBlock(pr, item, col, f, multi, o) {
  const isPrOnly = item.kind === 'pr';
  const tip = esc(`PR ${pr.id}: ${pr.title}`);
  const ageTxt = !f.a ? `<span class="age">${esc(pr.age)}${f.q || f.s ? '' : ' old'}</span>` : '';

  if (f.s) {
    const head = isPrOnly ? '' : `<div class="pr-row" title="${tip}">${prIcon()}<a class="pr-id" href="#">${pr.id}</a>${multi ? `<span class="repo">${esc(pr.repo)}</span>` : ''}${strip(pr)}${approvalText(pr)}<span class="spacer"></span>${ageTxt}</div>`;
    const prOnlyHead = isPrOnly ? `<div class="pr-row">${strip(pr)}${approvalText(pr)}<span class="spacer"></span>${ageTxt}</div>` : '';
    let below = '';
    if (f.n) below = stepLine(prStep(pr));
    else if (pr.checks.req === 'failing' || pr.checks.req === 'pending') below = `<div class="detail ${checksTone(pr)}-t">${icon(pr.checks.req === 'failing' ? 'error' : 'stopwatch')}<span>${esc(pr.checks.names.join(', '))} ${pr.checks.req}</span></div>`;
    const full = o.expanded && !isPrOnly ? `<div class="detail" style="color:var(--t-2)"><span style="white-space:normal">${esc(pr.title)}</span></div>` : '';
    const opt = o.expanded && pr.checks.optFail.length ? `<div class="detail neutral-t">${icon('error')}<span>Optional failing: ${esc(pr.checks.optFail.join(', '))}</span></div>` : '';
    return `<div>${head}${prOnlyHead}${full}${below}${opt}</div>`;
  }

  if (f.q) {
    const tone = checksTone(pr);
    const ckIcon = `<span class="${tone}-t" title="${esc(checksTip(pr))}" style="display:inline-flex">${icon(tone === 'critical' ? 'error' : tone === 'attention' ? 'stopwatch' : 'validate')}</span>`;
    const head = isPrOnly ? '' : `<div class="qpr">${prIcon()}<a class="pr-id" href="#">${pr.id}</a><span class="qpr-title" title="${esc(pr.title)}" ${o.expanded ? 'style="white-space:normal"' : ''}>${esc(pr.title)}</span>${f.n ? '' : ckIcon + approvalText(pr)}${ageTxt}</div>`;
    const prOnlyHead = isPrOnly && !f.n ? `<div class="qpr"><span class="spacer"></span>${ckIcon}${approvalText(pr)}${ageTxt}</div>` : (isPrOnly && !f.a ? `<div class="qpr"><span class="spacer"></span>${ageTxt}</div>` : '');
    let below = '';
    if (f.n) below = stepLine(prStep(pr));
    else if (pr.checks.req === 'failing' || pr.checks.req === 'pending') below = `<div class="detail ${tone}-t">${icon(pr.checks.req === 'failing' ? 'error' : 'stopwatch')}<span>${esc(pr.checks.names.join(', '))} ${pr.checks.req}</span></div>`;
    const opt = o.expanded && pr.checks.optFail.length ? `<div class="detail neutral-t">${icon('error')}<span>Optional failing: ${esc(pr.checks.optFail.join(', '))}</span></div>` : '';
    return `<div>${head}${prOnlyHead}${below}${opt}</div>`;
  }

  // classic chrome
  const line = isPrOnly ? '' : `<a class="pr-line" href="#">${f.n ? '' : approvalIcons(pr)}${prIcon()}<span class="pr-id">${pr.id}</span>${esc(pr.title)}</a>`;
  if (f.n) {
    const ageRow = !f.a ? `<div style="display:flex">${stepLine(prStep(pr)).replace('class="step', 'style="flex:1;min-width:0" class="step')}${ageTxt}</div>` : stepLine(prStep(pr));
    return `<div>${line}${ageRow}</div>`;
  }
  const tone = checksTone(pr);
  const c = pr.checks;
  const main = c.req === 'passing'
    ? `<div class="ck positive-t">${icon('validate')}Required checks passing</div>`
    : `<div class="ck ${tone}-t">${icon(c.req === 'failing' ? 'error' : c.req === 'pending' ? 'stopwatch' : 'validate')}${c.req === 'failing' ? 'Required checks failing: ' : c.req === 'pending' ? 'Required checks pending: ' : 'No applicable checks'}${esc(c.names.join(', '))}</div>`;
  const opts = c.optFail.map((n) => `<div class="ck opt">Optional checks failing: ${esc(n)}</div>`).join('');
  return `<div>${line}<div class="checks-row"><div class="checks-l">${main}${opts}</div>${ageTxt}</div></div>`;
}

// ---------- Card ----------
function renderCard(item, col, f, o = {}) {
  const isPrOnly = item.kind === 'pr';
  const prs = isPrOnly ? [item.pr] : (item.prs || []);
  const compact = f.c && !o.expanded;
  const cls = ['card', `col-${col}`, f.q ? 'quiet' : 'classic'];
  if (compact) cls.push('compact');
  if (o.expanded) cls.push('expanded');
  if (isPrOnly) cls.push('pr-only');
  if (!o.expanded && item.highlight === 'new') cls.push(f.a ? 'changed' : 'glow');
  if (!o.expanded && item.highlight === 'stale' && (!f.a || col === 'Done')) cls.push('stale');
  if (o.flip) cls.push('flip');

  // Corner element + title line
  let corner = '';
  if (!f.q) {
    if (item.state && !isPrOnly && !(f.n && cardStep(item)?.coversState)) corner = `<span class="state-chip" title="${esc(item.state)}">${esc(abbr(item.state))}</span>`;
    else if (isPrOnly && !compact && !f.s && !f.n) corner = approvalIcons(item.pr);
  } else if (typeof item.effort === 'number' && !isPrOnly) {
    corner = `<span class="effort-bubble" title="Effort ${item.effort}">${item.effort}</span>`;
  }
  const title = isPrOnly
    ? `<a class="title pr-line" href="#">${corner}${prIcon()}<span class="pr-id">${item.pr.id}</span>${esc(item.pr.title)}</a>`
    : `<a class="title" href="#">${corner}${typeIcon(item.type)}<span class="wi-id">${item.id}</span>${esc(item.title)}</a>`;

  let body = title;

  if (compact) {
    body += compactGlyphs(item, col, f, prs);
    body += `<div class="hovercard" role="dialog" aria-label="Details for ${isPrOnly ? 'PR' : ''} ${item.id}">${renderCard(item, col, { ...f, c: false }, { expanded: true })}</div>`;
    return `<div class="${cls.join(' ')}" tabindex="0">${body}</div>`;
  }

  // Tags
  const tags = (item.tags || []).filter((t) => !(f.n && /^blocked/i.test(t)));
  if (tags.length) body += `<div class="tags">${tags.map((t) => `<span class="tagpill">${esc(t)}</span>`).join('')}</div>`;

  // PR section(s)
  if (isPrOnly) {
    body += `<div style="margin-top:3px">${prBlock(item.pr, item, col, f, false, o)}</div>`;
  } else if (prs.length) {
    body += `<div class="sec">${prs.map((pr) => prBlock(pr, item, col, f, prs.length > 1, o)).join('')}</div>`;
  }

  // Card-level next step
  if (f.n) { const cs = cardStep(item); if (cs) body += stepLine(cs); }

  // Footer / meta
  body += f.q ? quietMeta(item, col, f, o) : classicFooter(item, col, f, o);

  if (o.expanded) body += hoverExtras(item, col);
  return `<div class="${cls.join(' ')}" tabindex="0">${body}</div>`;
}

function classicFooter(item, col, f) {
  const isPrOnly = item.kind === 'pr';
  const effort = typeof item.effort === 'number' && !isPrOnly ? `<span class="ef-l">Effort</span><span class="ef-v">${item.effort}</span>` : '';
  const change = f.a ? changeChip(item) : '';
  const aging = f.a ? agingDots(item, col) : '';
  const sprint = item.sprint ? `<span class="sprint">${item.rolled ? `<span title="Rolled over from ${esc(item.rolled)}" style="display:inline-flex">${icon('reschedule')}</span>` : ''}${esc(item.sprint)}</span>` : '';
  if (!effort && !change && !aging && !sprint) return '';
  if (isPrOnly) return `<div class="meta">${change}<span class="spacer"></span>${aging}</div>`;
  return `${change ? `<div class="meta">${change}</div>` : ''}<div class="footer">${effort}<span class="spacer"></span>${aging}${sprint}</div>`;
}

function quietMeta(item, col, f, o) {
  const parts = [stateBadge(item, col, f), f.a ? changeChip(item) : ''].filter(Boolean);
  const right = [];
  if (item.rolled) right.push(rolloverIcon(item));
  if (item.sprint && (item.sprint !== CUR || o.expanded)) right.push(`<span class="sprint" title="${esc(item.sprint)}">${esc(o.expanded ? item.sprint : shortSprint(item.sprint))}</span>`);
  if (f.a) { const a = agingDots(item, col); if (a) right.push(a); }
  if (!parts.length && !right.length) return '';
  return `<div class="meta">${parts.join('')}<span class="spacer"></span>${right.join('')}</div>`;
}

function compactGlyphs(item, col, f, prs) {
  const left = [];
  if (f.q) { const b = stateBadge(item, col, f); if (b) left.push(b); }
  for (const pr of prs) {
    const s = prStep(pr);
    if (f.s) left.push(`<span class="glyph" title="PR ${pr.id}: ${esc(s.text)}">${icon('git-branch')}${strip(pr)}</span>`);
    else {
      const tone = f.n ? s.tone : checksTone(pr);
      left.push(`<span class="glyph ${tone}" title="PR ${pr.id}: ${esc(f.n ? s.text : checksTip(pr))}">${icon('git-branch')}${pr.approvals}/${REQUIRED_APPROVALS}</span>`);
    }
  }
  if (f.n) {
    const cs = cardStep(item);
    if (cs) left.push(`<span class="glyph ${cs.tone}" title="${esc(cs.text)}">${icon(cs.icon)}</span>`);
    if (cs && cs.owner && cs.owner.kind === 'person') left.push(`<span class="glyph" title="Assigned to ${esc(PEOPLE[cs.owner.pid].name)}">${avatar(cs.owner.pid)}</span>`);
  }
  if (f.a) { const c = item.change ? `<span class="glyph ${item.change.kind === 'info' ? 'neutral' : item.change.kind}" title="Changed since last standup: ${esc(item.change.text)} · ${esc(item.change.when)}">${esc(item.change.text)}</span>` : ''; if (c) left.push(c); }
  const right = [];
  if (f.a) { const a = agingDots(item, col); if (a) right.push(a); }
  if (item.rolled) right.push(rolloverIcon(item));
  if (!f.q && typeof item.effort === 'number' && item.kind !== 'pr') right.push(`<span class="glyph" title="Effort ${item.effort}">${item.effort}</span>`);
  if (!left.length && !right.length) return '';
  return `<div class="glyphs">${left.join('')}<span class="spacer"></span>${right.join('')}</div>`;
}

function hoverExtras(item) {
  const rows = [];
  if (item.state) rows.push(['State', esc(item.state)]);
  if (item.sprint) rows.push(['Sprint', `${esc(item.sprint)}${item.rolled ? ` <span class="neutral-t">(rolled over from ${esc(item.rolled)})</span>` : ''}`]);
  const assignee = item.assignedTo || item.dev;
  rows.push(['Assigned to', `${avatar(assignee)} ${esc(PEOPLE[assignee].name)}${PEOPLE[assignee].qa ? ' (QA)' : ''}`]);
  if (item.returnedBy) rows.push(['Returned by', `${avatar(item.returnedBy)} ${esc(PEOPLE[item.returnedBy].name)}`]);
  rows.push(['Last activity', item.idle ? `${item.idle} days ago` : 'Today']);
  if (item.change) rows.push(['Since standup', esc(`${item.change.text} · ${item.change.when}`)]);
  return `<dl class="hc-extra">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

// ---------- Board ----------
function renderBoard(f) {
  const board = document.getElementById('board');
  const counts = Object.fromEntries(STATUSES.map((s) => [s, 0]));
  const effort = Object.fromEntries(STATUSES.map((s) => [s, 0]));
  for (const it of ITEMS) { counts[it.status]++; if (it.sprint === CUR && typeof it.effort === 'number') effort[it.status] += it.effort; }
  let html = `<div class="hcell member">Team member</div>`;
  for (const s of STATUSES) {
    html += `<div class="hcell tint-${s}"><span class="bar" style="background:var(--c-${s})"></span><div><div class="h-name">${s}</div><div class="h-sub">Current sprint effort: ${effort[s]}</div></div><span class="h-count" style="color:var(--c-${s})">${counts[s]}</span></div>`;
  }
  for (const row of ROWS) {
    const p = PEOPLE[row.pid];
    html += `<div class="rowhead">${avatar(row.pid, 'lg')}<div><b style="font-weight:500">${esc(p.name)}</b>${row.note ? `<span class="note">${esc(row.note)}</span>` : ''}</div></div>`;
    for (const s of STATUSES) {
      const cards = ITEMS.filter((it) => it.dev === row.pid && it.status === s);
      const flip = s === 'Review' || s === 'Done';
      html += `<div class="cell tint-${s}">${cards.map((it) => renderCard(it, s, f, { flip })).join('')}</div>`;
    }
  }
  board.innerHTML = html;
}

// ---------- Gallery ----------
const VARIANTS = [
  { label: 'Current', sub: 'Baseline replica', f: {} },
  { label: '1 · Quiet card', sub: 'Exception-only metadata', f: { q: 1 } },
  { label: '2 · Next step & owner', sub: 'On current chrome', f: { n: 1 } },
  { label: '3 · PR progress strip', sub: 'On current chrome', f: { s: 1 } },
  { label: '4 · Meaningful aging', sub: 'On current chrome', f: { a: 1 } },
  { label: '5 · Compact + hover', sub: 'Hover a card for details', f: { c: 1 } },
  { label: 'Recommended', sub: '1 + 2 + 3 + 4', f: { q: 1, n: 1, s: 1, a: 1 } },
  { label: 'Recommended + compact', sub: '1 + 2 + 3 + 4 + 5', f: { q: 1, n: 1, s: 1, a: 1, c: 1 } },
];

function renderGallery() {
  const g = document.getElementById('gallery');
  g.style.setProperty('--cols', VARIANTS.length);
  let html = `<div class="g-colhead">Scenario</div>`;
  for (const v of VARIANTS) html += `<div class="g-colhead">${esc(v.label)}<small>${esc(v.sub)}</small></div>`;
  for (const r of GALLERY_ROWS) {
    const item = ITEMS.find((it) => it.id === r.id);
    html += `<div class="g-rowhead">${esc(r.label)}<small>${esc(item.status)} column · ${esc(r.note)}</small></div>`;
    VARIANTS.forEach((v, i) => {
      html += `<div class="g-cell tint-${item.status}">${renderCard(item, item.status, v.f, { flip: i >= VARIANTS.length - 3 })}</div>`;
    });
  }
  g.innerHTML = html;
}

// ---------- Rationale ----------
function renderRationale(f) {
  const el = document.getElementById('rationale');
  const active = PROPOSALS.filter((p) => f[p.key]);
  if (!active.length) {
    el.innerHTML = `<div class="rcard"><h3>Current design (baseline)</h3>A replica of today's card, built from the same data, for side-by-side comparison. Turn on proposals above, or switch to <b>Gallery</b> to compare every variant on the same scenarios.<div class="legend"><span>Anatomy today: type icon · ID · title · state chip · PR ID + title · approvals · required/optional checks · age · Effort · sprint · rollover · glow (new) · dimming (stale)</span></div></div>`;
    return;
  }
  el.innerHTML = active.map((p) => `
    <div class="rcard">
      <h3><span class="num">${p.num}</span>${esc(p.title)}</h3>
      <div><span class="tag">Problem.</span> ${esc(p.problem)}</div>
      <ul>${p.changes.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      ${p.key === 's' ? `<div class="legend"><span>${seg('positive', 100, '')}${seg('positive', 50, '')}${seg('', 0, '')} checks · review · complete</span><span>${seg('critical', 100, '')} failing / rejected</span><span>${seg('pending', 100, '')} pending</span><span>${seg('attention', 100, '')} waiting on author</span><span>${seg('ready', 0, '')} ready to complete</span></div>` : ''}
      ${p.key === 'a' ? `<div class="legend"><span><span class="aging"><i class="on"></i><i></i><i></i><i></i></span> 2–3 days</span><span><span class="aging attention"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span> 6–7 days</span><span><span class="aging critical"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span> 8+ days</span><span><span style="width:9px;height:9px;border-radius:50%;background:var(--stratakit-color-bg-info-base);display:inline-block"></span> changed since last standup</span></div>` : ''}
      <div class="facts">${Object.entries(p.facts).map(([k, v]) => `<span><b>${esc(k)}:</b> ${esc(v)}</span>`).join('')}</div>
    </div>`).join('');
}

// ---------- State ----------
const state = { view: 'board', f: {} };

function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  state.view = params.get('view') === 'gallery' ? 'gallery' : 'board';
  const p = (params.get('p') || '').split(',').filter(Boolean);
  state.f = {};
  for (const num of p) { const prop = PROPOSALS.find((x) => String(x.num) === num); if (prop) state.f[prop.key] = 1; }
}

function writeHash() {
  const nums = PROPOSALS.filter((p) => state.f[p.key]).map((p) => p.num).join(',');
  history.replaceState(null, '', `#view=${state.view}${nums ? `&p=${nums}` : ''}`);
}

function render() {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === state.view)));
  document.getElementById('board-view').hidden = state.view !== 'board';
  document.getElementById('gallery-view').hidden = state.view !== 'gallery';
  document.getElementById('toggles').innerHTML = PROPOSALS.map((p) => `<button class="tbtn" data-key="${p.key}" aria-pressed="${Boolean(state.f[p.key])}" ${state.view === 'gallery' ? 'disabled title="The gallery shows every variant"' : ''}><span class="num">${p.num}</span>${esc(p.short)}</button>`).join('');
  document.querySelectorAll('[data-preset]').forEach((b) => {
    const nums = PROPOSALS.filter((p) => state.f[p.key]).map((p) => p.num).join(',');
    b.setAttribute('aria-pressed', String(state.view === 'board' && b.dataset.preset === nums));
    b.disabled = state.view === 'gallery';
  });
  renderRationale(state.view === 'gallery' ? { q: 1, n: 1, s: 1, a: 1, c: 1 } : state.f);
  if (state.view === 'board') renderBoard(state.f); else renderGallery();
  writeHash();
}

document.addEventListener('click', (e) => {
  const notes = e.target.closest('#notes-toggle');
  if (notes) { const on = notes.getAttribute('aria-pressed') !== 'true'; notes.setAttribute('aria-pressed', String(on)); document.getElementById('rationale').hidden = !on; return; }
  const tab = e.target.closest('.tab');
  if (tab) { state.view = tab.dataset.view; render(); return; }
  const t = e.target.closest('[data-key]');
  if (t && !t.disabled) { const k = t.dataset.key; state.f[k] = state.f[k] ? 0 : 1; if (!state.f[k]) delete state.f[k]; render(); return; }
  const pr = e.target.closest('[data-preset]');
  if (pr && !pr.disabled) { state.f = {}; pr.dataset.preset.split(',').filter(Boolean).forEach((n) => { const p = PROPOSALS.find((x) => String(x.num) === n); state.f[p.key] = 1; }); render(); return; }
  if (e.target.closest('a[href="#"]')) e.preventDefault();
});
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash();
render();
</script>
